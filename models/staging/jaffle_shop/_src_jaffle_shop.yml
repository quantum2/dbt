sources:
  - name: jaffle_shop
    database: raw
    schema: jaffle_shop
    description: A clone of a postgres application database
    # config: 
    #   freshness:
    #     warn_after:
    #       count: 1
    #       period: day
    #     error_after:
    #       count: 1
    #       period: day
    #   loaded_at_field: order_date

    tables:
      - name: shop_customers
        description: raw customers data
        columns:
          - name: id
            description: primary key for the customers table
            data_tests:
              - unique
              - not_null
              
      - name: shop_orders
        description: raw orders data
        columns:
          - name: id
            description: primary key for the orders table
            data_tests:
            - unique
            - not_null
            
             
        
        
        